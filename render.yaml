services:
  - type: web
    name: donot-listen-api
    env: java
    region: singapore
    plan: free
    rootDir: dl
    buildCommand: mvn package -DskipTests
    startCommand: java -jar target/donot-listen-1.0.0.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        value: your-db-host
      - key: DB_NAME
        value: donotlisten
      - key: DB_USERNAME
        value: your-db-user
      - key: DB_PASSWORD
        value: your-db-password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://qianduan-alpha.vercel.app
