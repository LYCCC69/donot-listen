# H2 in-memory (开发环境无需 MySQL)
spring.datasource.url=jdbc:h2:mem:donotlisten;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=MONTH,YEAR
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA 自动建表
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# 禁用 Flyway (H2 无需迁移)
spring.flyway.enabled=false

# H2 Console (可访问 http://localhost:8082/h2-console 查看数据库)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.com.donotlisten=DEBUG
