# Database (set via env vars: DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:donotlisten}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# PostgreSQL support (set spring.datasource.url=spring.datasource.url=jdbc:postgresql://... to switch)
# spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway
spring.flyway.enabled=false

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://your-frontend.vercel.app}

# JWT
jwt.secret=${JWT_SECRET:change-this-to-a-random-secret-in-production}
jwt.ttl-days=${JWT_TTL_DAYS:7}

logging.level.com.donotlisten=WARN
